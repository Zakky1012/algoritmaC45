<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Jungle - Sign In</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        * {
            font-family: 'Inter', sans-serif;
        }
        
        .gradient-bg {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #a855f7 100%);
        }
        
        .card-shadow {
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }
    </style>
</head>
<body class="min-h-screen gradient-bg flex items-center justify-center p-4">
    <!-- Main Card Container -->
    <div class="w-full max-w-5xl bg-white rounded-3xl overflow-hidden card-shadow flex flex-col lg:flex-row min-h-[600px]">
        
        <!-- Left Section - Purple Background -->
        <div class="flex-1 bg-gradient-to-br from-indigo-500 via-purple-500 to-purple-600 p-8 lg:p-12 flex flex-col justify-center text-white relative">
            <!-- Logo -->
            <div class="mb-12">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 bg-white bg-opacity-20 rounded-lg flex items-center justify-center">
                        <i class="fas fa-calendar-alt text-white text-lg"></i>
                    </div>
                    <span class="text-xl font-medium">Event Jungle</span>
                </div>
            </div>
            
            <!-- Welcome Content -->
            <div class="mb-16">
                <h1 class="text-5xl font-bold mb-8 leading-tight">
                    Hey There!
                </h1>
                <div class="space-y-2 mb-12">
                    <p class="text-2xl font-medium">
                        Welcome Back.
                    </p>
                    <p class="text-lg opacity-90">
                        You are just one step away to your feed.
                    </p>
                </div>
            </div>
            
            <!-- Sign Up Section -->
            <div class="mt-auto">
                <p class="text-lg mb-6 opacity-90">Don't have an account?</p>
                <button id="signUpBtn" class="px-8 py-3 border-2 border-white border-opacity-60 rounded-full text-white font-medium hover:bg-white hover:text-purple-600 transition-all duration-300">
                    Sign Up
                </button>
            </div>
        </div>
        
        <!-- Right Section - White Form -->
        <div class="flex-1 p-8 lg:p-12 flex flex-col justify-center">
            <div class="max-w-sm mx-auto w-full">
                <!-- Sign In Header -->
                <div class="text-center mb-8">
                    <h2 class="text-2xl font-bold text-gray-800 tracking-wide">SIGN IN</h2>
                </div>
                
                <form id="signInForm" class="space-y-6">
                    <!-- Email Input -->
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-2">Email</label>
                        <input 
                            type="email" 
                            id="email"
                            value="kabbollate@gmail.com"
                            class="w-full px-4 py-4 bg-white border-2 border-gray-200 rounded-xl focus:outline-none focus:border-purple-500 transition-all duration-300 text-gray-700"
                            required
                        >
                    </div>
                    
                    <!-- Password Input -->
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-2">Password</label>
                        <input 
                            type="password" 
                            id="password"
                            placeholder="Password"
                            class="w-full px-4 py-4 bg-white border-2 border-gray-200 rounded-xl focus:outline-none focus:border-purple-500 transition-all duration-300 text-gray-700"
                            required
                        >
                    </div>
                    
                    <!-- Remember Me & Forgot Password -->
                    <div class="flex items-center justify-between">
                        <label class="flex items-center cursor-pointer">
                            <input type="checkbox" id="rememberMe" class="w-4 h-4 rounded border-2 border-gray-300 text-purple-600 focus:ring-purple-500 focus:ring-2">
                            <span class="ml-3 text-sm text-gray-600">Keep me logged in</span>
                        </label>
                        <a href="#" class="text-sm text-orange-500 hover:text-orange-600 font-medium">
                            Forgot Password?
                        </a>
                    </div>
                    
                    <!-- Sign In Button -->
                    <button 
                        type="submit"
                        class="w-full bg-purple-600 text-white py-4 rounded-xl font-semibold hover:bg-purple-700 transition-all duration-300 text-lg"
                    >
                        Sign In
                    </button>
                </form>
                
                <!-- Social Media Sign In -->
                <div class="text-center mt-8">
                    <p class="text-gray-400 text-sm mb-6">Or, Use social media to sign in</p>
                    <div class="flex justify-center space-x-4">
                        <button type="button" class="w-12 h-12 bg-blue-600 text-white rounded-full flex items-center justify-center hover:bg-blue-700 transition-all duration-300 hover:scale-105">
                            <i class="fab fa-facebook-f text-lg"></i>
                        </button>
                        <button type="button" class="w-12 h-12 bg-sky-500 text-white rounded-full flex items-center justify-center hover:bg-sky-600 transition-all duration-300 hover:scale-105">
                            <i class="fab fa-twitter text-lg"></i>
                        </button>
                        <button type="button" class="w-12 h-12 bg-blue-700 text-white rounded-full flex items-center justify-center hover:bg-blue-800 transition-all duration-300 hover:scale-105">
                            <i class="fab fa-linkedin-in text-lg"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Bottom Text -->
    <div class="absolute bottom-6 right-6 text-white text-sm opacity-70">
        <span>Jelajahi</span>
        <button class="ml-2 hover:underline" id="refreshBtn">
            <i class="fas fa-sync-alt mr-1"></i>
        </button>
    </div>

    <script>
        // Form submission
        const signInForm = document.getElementById('signInForm');
        signInForm.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const rememberMe = document.getElementById('rememberMe').checked;
            
            // Add loading state
            const submitBtn = e.target.querySelector('button[type="submit"]');
            const originalText = submitBtn.textContent;
            submitBtn.textContent = 'Signing In...';
            submitBtn.disabled = true;
            
            // Simulate API call
            setTimeout(() => {
                alert(`Sign in berhasil!\nEmail: ${email}\nRemember Me: ${rememberMe}`);
                submitBtn.textContent = originalText;
                submitBtn.disabled = false;
            }, 1500);
        });

        // Sign Up button
        const signUpBtn = document.getElementById('signUpBtn');
        signUpBtn.addEventListener('click', function() {
            alert('Mengarahkan ke halaman Sign Up...');
        });

        // Social media buttons
        const socialButtons = document.querySelectorAll('[class*="bg-blue"], [class*="bg-sky"]');
        socialButtons.forEach(button => {
            button.addEventListener('click', function() {
                const platform = this.querySelector('i').classList.contains('fa-facebook-f') ? 'Facebook' : 
                               this.querySelector('i').classList.contains('fa-twitter') ? 'Twitter' : 'LinkedIn';
                alert(`Login dengan ${platform}!`);
            });
        });

        // Refresh button
        const refreshBtn = document.getElementById('refreshBtn');
        refreshBtn.addEventListener('click', function() {
            this.style.transform = 'rotate(360deg)';
            setTimeout(() => {
                this.style.transform = 'rotate(0deg)';
            }, 500);
        });

        // Input animations
        const inputs = document.querySelectorAll('input[type="email"], input[type="password"]');
        inputs.forEach(input => {
            input.addEventListener('focus', function() {
                this.style.transform = 'translateY(-2px)';
                this.style.boxShadow = '0 8px 25px rgba(0, 0, 0, 0.1)';
            });
            
            input.addEventListener('blur', function() {
                this.style.transform = 'translateY(0)';
                this.style.boxShadow = 'none';
            });
        });
    </script>
</body>
</html>
